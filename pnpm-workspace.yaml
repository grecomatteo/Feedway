packages:
  - apps/*
  - packages/*
  - tools/*

# Nessuno script di installazione delle dipendenze viene eseguito (esbuild usa il binario precompilato).
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@nuxt/ui@4.12.0'
  - '@axe-core/playwright@4.14.0'
