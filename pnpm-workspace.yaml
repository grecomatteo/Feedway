packages:
  - apps/*
  - packages/*
  - tools/*

# Nessuno script di installazione delle dipendenze viene eseguito (esbuild usa il binario precompilato).
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@nuxt/ui@4.12.0'
  - '@axe-core/playwright@4.14.0'

# Advisories without a patched version, in a build-time tool that is not part of the production image.
auditConfig:
  ignoreGhsas:
    # deepmerge (prototype poisoning of the merged object): no fixed version yet. Only
    # @rollup/plugin-node-resolve uses it, while building, on its own options.
    - GHSA-gcqx-w48m-w2h4

# Better Auth lists vitest, vue and drizzle-kit as optional peers. pnpm would link the workspace's own dev tools
# as those peers, and `pnpm deploy --prod` would then ship them (and esbuild's Go binary) in the image.
# Kept here rather than in a pnpmfile because Renovate ignores pnpmfiles when it updates the lockfile.
overrides:
  better-auth>vitest: '-'
  better-auth>vue: '-'
  better-auth>drizzle-kit: '-'
  # Patched versions of transitive dependencies flagged by Dependabot (30/10). Remove each line
  # once the package that pulls it in ships the fixed version on its own.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  'fontless>esbuild': 0.28.2
  '@rollup/plugin-terser>serialize-javascript': 7.1.4
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'seroval@>=1.5.5 <1.6.11': 1.7.6
  'listhen>node-forge': 1.4.2
