packages:
  - apps/*
  - packages/*
  - tools/*

# Nessuno script di installazione delle dipendenze viene eseguito (esbuild usa il binario precompilato).
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@nuxt/ui@4.12.0'
  - '@axe-core/playwright@4.14.0'

# Advisories without a patched version, both in build-time tools that nitropack pulls in:
# node-forge (listhen, HTTPS dev server) and braces (globby, file globbing while building).
# Neither is part of the production image. Remove when nitropack ships a fixed version.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm

# Better Auth lists vitest, vue and drizzle-kit as optional peers. pnpm would link the workspace's own dev tools
# as those peers, and `pnpm deploy --prod` would then ship them (and esbuild's Go binary) in the image.
# Kept here rather than in a pnpmfile because Renovate ignores pnpmfiles when it updates the lockfile.
overrides:
  better-auth>vitest: '-'
  better-auth>vue: '-'
  better-auth>drizzle-kit: '-'
