name: CI

on:
  # No run on push to main: the ruleset only merges a branch up to date with main and green on its
  # merge commit, so the squashed commit has the tree CI already tested. Running again costs ~30
  # billed minutes per merge for nothing.
  pull_request:
  # Release PRs are opened with the default token and do not start workflows: run CI by hand on their branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on GitHub's runners unless the repository variable CI_RUNNER names another runner label
# (a self-hosted runner once the monthly Actions minutes are spent, never while the repository is
# public: docs/flusso-git.md §5).
# timeout-minutes stops a hung job instead of letting it run for the 6 hour default.
# The job names below are the required checks of the main ruleset (.github/rulesets/main.json).
jobs:
  lint-types:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm format:check
      - if: steps.changes.outputs.code != 'false'
        run: pnpm lint
      - if: steps.changes.outputs.code != 'false'
        run: pnpm typecheck
      - if: steps.changes.outputs.code != 'false'
        run: shellcheck docker/entrypoint.sh scripts/install.sh scripts/update.sh scripts/lib/*.sh scripts/ci/*.sh scripts/github/*.sh scripts/tests/stubs/*
      - if: steps.changes.outputs.code != 'false'
        name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 && ./actionlint -color

  architecture:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm arch:check
      - if: steps.changes.outputs.code != 'false'
        run: pnpm vitest run tools/arch-fixtures

  unit:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test:unit

  # Every job always runs, so the required checks always report, but on a pull request that changes
  # only documentation, design or agent instructions everything except checkout and gitleaks is
  # skipped (scripts/ci/changes.sh); Prettier ignores those files anyway (.prettierignore).
  # Manual runs do everything. Steps skip only on an explicit 'false', so a
  # missing output runs them.
  integration:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test:int

  e2e:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm audit --audit-level high
      - if: steps.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install --yes bats age
      - if: steps.changes.outputs.code != 'false'
        run: bats scripts/tests

  image:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        run: docker build -f docker/Dockerfile -t app:ci --build-arg APP_VERSION=0.0.0-ci .
      - if: steps.changes.outputs.code != 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      # The VPS may be arm64: prove the same Dockerfile builds there before a release does.
      # Emulating it takes about 9 minutes, so a pull request runs it only when the Dockerfile,
      # the dependencies or the Node version change; the release builds arm64 again anyway.
      - if: steps.changes.outputs.arm64 != 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - if: steps.changes.outputs.arm64 != 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Immagine arm64
        if: steps.changes.outputs.arm64 != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          build-args: APP_VERSION=0.0.0-ci
          load: true
          tags: app:ci-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Native modules must arrive as platform packages: the image installs with --ignore-scripts.
      - name: Moduli nativi nelle immagini
        if: steps.changes.outputs.code != 'false'
        env:
          ARM64: ${{ steps.changes.outputs.arm64 }}
        run: |
          check="import('@node-rs/argon2').then(async (m) => { if (!(await m.verify(await m.hash('x'), 'x'))) process.exit(1); console.log('argon2 ok', process.arch) })"
          docker run --rm --entrypoint node -w /app/apps/worker app:ci -e "$check"
          if [ "$ARM64" != false ]; then
            docker run --rm --platform linux/arm64 --entrypoint node -w /app/apps/worker app:ci-arm64 -e "$check"
          fi

  install-smoke:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install --yes age
      - if: steps.changes.outputs.code != 'false'
        run: docker build -f docker/Dockerfile -t app:ci --build-arg APP_VERSION=0.0.0-ci .
      - if: steps.changes.outputs.code != 'false'
        run: scripts/ci/compose-smoke.sh
