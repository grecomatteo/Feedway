name: CI

on:
  # No run on push to main: the ruleset only merges a branch up to date with main and green on its
  # merge commit, so the squashed commit has the tree CI already tested. Running again costs ~30
  # billed minutes per merge for nothing.
  # A draft runs nothing: the run starts when the PR is marked ready, then at every push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Release PRs are opened with the default token and do not start workflows: run CI by hand on their branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on GitHub's runners unless the repository variable CI_RUNNER names another runner label
# (a self-hosted runner once the monthly Actions minutes are spent, never while the repository is
# public: docs/flusso-git.md §5).
# timeout-minutes stops a hung job instead of letting it run for the 6 hour default.
# The job names below are the required checks of the main ruleset (.github/rulesets/main.json),
# except image-arm64, which `image` reports.
jobs:
  lint-types:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm format:check
      - if: steps.changes.outputs.code != 'false'
        run: pnpm lint
      - if: steps.changes.outputs.code != 'false'
        run: pnpm typecheck
      - if: steps.changes.outputs.code != 'false'
        run: shellcheck docker/entrypoint.sh scripts/install.sh scripts/update.sh scripts/fw.sh scripts/compose.sh scripts/lib/*.sh scripts/ci/*.sh scripts/github/*.sh scripts/tests/stubs/*
      - if: steps.changes.outputs.code != 'false'
        name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 && ./actionlint -color

  architecture:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm arch:check
      - if: steps.changes.outputs.code != 'false'
        run: pnpm vitest run tools/arch-fixtures

  unit:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test:unit

  # Every job always runs, so the required checks always report, but on a pull request that changes
  # only documentation, design or agent instructions everything except checkout and gitleaks is
  # skipped (scripts/ci/changes.sh); Prettier ignores those files anyway (.prettierignore).
  # Manual runs do everything. Steps skip only on an explicit 'false', so a
  # missing output runs them.
  integration:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test:int

  e2e:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - if: steps.changes.outputs.code != 'false'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  security:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.changes.outputs.code != 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.code != 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.code != 'false'
        run: pnpm audit --audit-level high
      - if: steps.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install --yes bats age
      - if: steps.changes.outputs.code != 'false'
        run: bats scripts/tests

  # arm64 builds natively on GitHub's arm64 runner (free while the repository is public): emulating
  # it with QEMU took 7 minutes with a warm cache and timed out at 45 without one. The release builds
  # it the same way. Not a required check: `image` waits for it and fails if it failed, so the
  # ruleset keeps its job names. A pull request builds it only when the Dockerfile, the
  # dependencies, Node or the CI change; the release builds arm64 again anyway.
  # With CI_RUNNER set (self-hosted fallback) and no CI_ARM64_RUNNER, the job runs on CI_RUNNER and
  # skips the build, so no GitHub minutes are needed.
  image-arm64:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_ARM64_RUNNER || vars.CI_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - name: Build arm64 saltata
        if: steps.changes.outputs.arm64 != 'false' && !vars.CI_ARM64_RUNNER && vars.CI_RUNNER
        run: echo "::warning::CI_RUNNER senza CI_ARM64_RUNNER, build arm64 saltata (la rifà il rilascio)."
      - name: Immagine arm64
        if: steps.changes.outputs.arm64 != 'false' && (vars.CI_ARM64_RUNNER || !vars.CI_RUNNER)
        run: docker build -f docker/Dockerfile -t app:ci-arm64 --build-arg APP_VERSION=0.0.0-ci .
      # Native modules must arrive as platform packages: the image installs with --ignore-scripts.
      - name: Moduli nativi nell'immagine arm64
        if: steps.changes.outputs.arm64 != 'false' && (vars.CI_ARM64_RUNNER || !vars.CI_RUNNER)
        run: |
          docker run --rm --entrypoint node -w /app/apps/worker app:ci-arm64 -e \
            "import('@node-rs/argon2').then(async (m) => { if (process.arch !== 'arm64' || !(await m.verify(await m.hash('x'), 'x'))) process.exit(1); console.log('argon2 ok', process.arch) })"

  image:
    needs: image-arm64
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Esito della build arm64
        env:
          ARM64_RESULT: ${{ needs.image-arm64.result }}
        run: |
          echo "image-arm64: $ARM64_RESULT"
          [ "$ARM64_RESULT" = success ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        run: docker build -f docker/Dockerfile -t app:ci --build-arg APP_VERSION=0.0.0-ci .
      - if: steps.changes.outputs.code != 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      # Native modules must arrive as platform packages: the image installs with --ignore-scripts.
      - name: Moduli nativi nell'immagine
        if: steps.changes.outputs.code != 'false'
        run: |
          docker run --rm --entrypoint node -w /app/apps/worker app:ci -e \
            "import('@node-rs/argon2').then(async (m) => { if (!(await m.verify(await m.hash('x'), 'x'))) process.exit(1); console.log('argon2 ok', process.arch) })"

  install-smoke:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: scripts/ci/changes-step.sh
      - if: steps.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install --yes age
      - if: steps.changes.outputs.code != 'false'
        run: docker build -f docker/Dockerfile -t app:ci --build-arg APP_VERSION=0.0.0-ci .
      - if: steps.changes.outputs.code != 'false'
        run: scripts/ci/compose-smoke.sh
