name: Rilascio

on:
  push:
    branches: [main]
  # Publishes the image of an existing release again, for example after a stuck build.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del rilascio da ripubblicare (es. v0.4.0)'
        required: true

# Each job asks for what it needs, nothing more.
permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Each architecture builds on its own runner: emulating arm64 on amd64 can stall the Nuxt build
  # for hours. The arm64 runners are free while the repository is public.
  publish-image:
    needs: release-please
    if: >-
      !cancelled() && (needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Tag del rilascio
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag non valido: $TAG" >&2; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/feedway" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Immagine per la scansione
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Accesso a GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pubblicazione su GHCR (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}

  # One tag for both architectures: Docker on the VPS picks its own.
  publish-manifest:
    needs: [release-please, publish-image]
    if: ${{ !cancelled() && needs.publish-image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Nome immagine
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/feedway" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Accesso a GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Tag unico per amd64 e arm64
        run: docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
      - name: Riepilogo
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Immagine pubblicata (amd64 e arm64): $IMAGE@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
