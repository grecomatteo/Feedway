name: Sito pubblico

# Publishes apps/site on Cloudflare Pages (ADR 013) when main changes something the site is built
# from, or by hand. Until the Cloudflare secrets exist the job says so and stops without failing.
# The build refuses a privacy notice that still has «DA COMPLETARE» in it (SITE_RELEASE=1).
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/ui/**
      - packages/config/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/site-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the Cloudflare secrets stay out of the job env: install and build scripts never see them
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://feedway.pages.dev' }}
      SITE_PROJECT: ${{ vars.SITE_PROJECT || 'feedway' }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Mancano i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: il sito non si pubblica (docs/runbooks/sito-pubblico.md)."
            echo "ready=false" >>"$GITHUB_OUTPUT"
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm --filter @app/site generate
        env:
          SITE_RELEASE: '1'
      # wrangler also bundles apps/site/functions (the «Richiedi una demo» function)
      - if: steps.secrets.outputs.ready == 'true'
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.20.0 pages deploy .output/public --project-name "$SITE_PROJECT" --branch main --commit-dirty=true
