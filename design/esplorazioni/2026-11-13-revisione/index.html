<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedway · esplorazione</title>
<style>
@font-face { font-family: Sora; src: url(Sora-Variable.ttf) format('truetype'); font-weight: 100 800; }
:root {
  --bg:#FAF9F6; --surface:#FFFFFF; --sunken:#F3F1EC; --nav:#F3F1EC; --nav-hover:#E9E6DF;
  --text:#242321; --muted:#5F5B55; --border:#E3DFD7; --strong:#CFCAC0;
  --brand:#FF762E; --on-brand:#242321; --brand-soft:#FFE8DA;
  --ok:#17693F; --ok-soft:#E3F3EA; --warn:#8A5200; --warn-soft:#FFF1D2; --bad:#B3261E; --bad-soft:#FCE9E7;
  --info:#1F5AA6; --info-soft:#E7EFFA;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
h1, h2, .sora { font-family: Sora, system-ui, sans-serif; font-weight: 650; letter-spacing: -0.01em; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.app { min-height: 100dvh; display: flex; }
.side { width: 256px; flex: none; background: var(--nav); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100dvh; }
.side .logo img { height: 26px; display: block; margin: 6px 8px; }
.row-nav { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; font-size: 14px; }
.row-nav.on { background: var(--brand-soft); font-weight: 600; }
.ctx { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; border-radius: 10px; font-size: 14px; }
.ctx .tile { width: 32px; height: 32px; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.me { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; display: flex; gap: 10px; align-items: center; padding-left: 8px; }
.me small { display: block; color: var(--muted); font-size: 12px; }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 650; background: var(--sunken); color: var(--text); flex: none; }
main { flex: 1; min-width: 0; padding: 32px 32px 48px; }
.wrap { max-width: 1040px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.head h1 { font-size: 30px; line-height: 1.15; }
.head p { color: var(--muted); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn.pri { background: var(--brand); color: var(--on-brand); border: 1.5px solid var(--text); }
.btn.out { border: 1px solid var(--strong); background: var(--surface); }
.btn.ghost { padding: 0; }
.btn.ghost:hover { background: var(--sunken); }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; }
.chip svg.i { width: 14px; height: 14px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.none { background: var(--sunken); color: var(--muted); }
.chip.info { background: var(--info-soft); color: var(--info); }
.top { display: none; }
.tabbar { display: none; }
.sk { background: var(--sunken); border-radius: 4px; animation: p 1.4s ease-in-out infinite; display: block; }
@keyframes p { 50% { opacity: .5 } }
.note { margin-top: 20px; font-size: 13px; color: var(--muted); }

/* ===== A · Elenco ===== */
.A .list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.A .list > li { list-style: none; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px 8px 16px; }
.A .list > li + li { border-top: 1px solid var(--border); }
.A .list .name { font-weight: 600; }
.A .list .sub { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.A .grow { flex: 1; min-width: 0; }
.A .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.A .sec { margin-top: 24px; }
.A .sec h2 { font-size: 16px; margin-bottom: 8px; }
.A details { margin-top: 16px; background: var(--sunken); border: 1px solid var(--border); border-radius: 12px; }
.A summary { min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-weight: 600; list-style: none; }

/* ===== B · Tabella (Hallmark, cartoncino) ===== */
.B { --bg:#F6F3EE; --surface:#FFFDF9; }
.B .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: -1px 0 0 rgba(255,255,255,.8) inset, 3px 4px 0 -1px rgba(36,35,33,.05), 6px 10px 24px -12px rgba(36,35,33,.18); overflow: hidden; }
.B .tools { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.B .seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--border); border-radius: 10px; padding: 3px; box-shadow: inset 0 1px 2px rgba(36,35,33,.08); }
.B .seg button { min-height: 36px; padding: 0 14px; border-radius: 7px; font-size: 13.5px; color: var(--muted); }
.B .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(36,35,33,.15); }
.B .seg b { font-variant-numeric: tabular-nums; font-weight: 500; margin-left: 4px; }
.B .search { flex: 1; min-width: 180px; max-width: 320px; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid var(--strong); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 14px; }
.B table { width: 100%; border-collapse: collapse; font-size: 14px; }
.B th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); background: var(--sunken); padding: 10px 16px; border-bottom: 1px solid var(--border); }
.B td > * { vertical-align: middle; }
.B td { padding: 0 16px; height: 56px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.B tr:last-child td { border-bottom: 0; }
.B tbody tr:hover { background: #FBF7F1; }
.B .cl { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.B .sq { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--sunken); border: 1px solid var(--border); }
.B .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; }
.B td.act { width: 56px; text-align: right; padding-right: 8px; }
.B .mob { display: none; }

/* ===== C · Officina (skill Web Designer: una superficie, filetti, niente scatole) ===== */
.C { --bg:#FFFFFF; --surface:#FFFFFF; }
.C .app { display: block; }
.C .side { display: none; }
.C .bar { display: flex; align-items: center; gap: 24px; height: 60px; padding: 0 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
.C .bar img { height: 22px; }
.C .bar .org { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding-left: 16px; border-left: 1px solid var(--border); }
.C .bar nav { display: flex; gap: 4px; }
.C .bar nav a { font-size: 14px; color: var(--muted); padding: 0 10px; height: 60px; display: flex; align-items: center; border-bottom: 2px solid transparent; }
.C .bar nav a.on { color: var(--text); font-weight: 600; border-bottom-color: var(--brand); }
.C .bar .k { margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--muted); width: 240px; }
.C .bar kbd { margin-left: auto; font: 12px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.C main { padding-top: 40px; }
.C .wrap { max-width: 1120px; }
.C .head h1 { font-size: 28px; }
.C .t { width: 100%; border-collapse: collapse; font-size: 14px; }
.C .t th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 0 12px 8px; border-bottom: 1px solid var(--text); }
.C .t th.r, .C .t td.r { text-align: right; }
.C .t td { height: 52px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.C .t td.nm { font-weight: 600; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.C .t td.h { color: var(--muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
.C .t tr:hover td { background: #FAF9F6; }
.C .t td.act { width: 44px; padding: 0; }
.C .st { display: inline-flex; align-items: center; gap: 8px; }
.C .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--strong); }
.C .st.ok i { background: var(--ok); }
.C .st.warn { color: var(--warn); font-weight: 600; }
.C .st.warn i { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.C .num { font-variant-numeric: tabular-nums; }
.C .sum { margin: -8px 0 24px; font-size: 14px; }
.C .sum a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.C .mob { display: none; }
/* ===== telefono ===== */
@media (max-width: 767px) {
  .side { display: none; }
  .app { display: block; }
  main { padding: 20px 16px 104px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  .top img { height: 22px; }
  .top .ctxm { display: flex; align-items: center; gap: 6px; font-size: 13.5px; min-height: 44px; }
  .head { margin-bottom: 16px; }
  .head h1 { font-size: 26px; }
  .head .btn.pri span.l { display: none; }
  .head .btn.pri { position: absolute; right: 16px; }
  .head { position: relative; padding-right: 56px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; inset: auto 0 0 0; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  .tabbar a { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--muted); text-decoration: none; }
  .tabbar a.on { color: var(--text); font-weight: 650; }
  .tabbar a.on svg { color: var(--text); }
  .tabbar .plus { width: 48px; height: 48px; border-radius: 50%; background: var(--brand); border: 1.5px solid var(--text); display: grid; place-items: center; color: var(--text); }
  .tabbar .plus.soon { background: var(--sunken); border-color: var(--strong); color: var(--muted); }
  .A .list > li { padding: 8px 4px 8px 12px; }
  .A .lbl { display: none; }
  .B .tools .search { max-width: none; order: 2; flex-basis: 100%; }
  .B table.desk { display: none; }
  .B .mob { display: block; list-style: none; }
  .B .mob li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 4px 8px 12px; border-bottom: 1px solid var(--border); }
  .B .mob li:last-child { border-bottom: 0; }
  .B .mob .g { flex: 1; min-width: 0; }
  .B .mob .g b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .B .mob .g span { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .C .bar { display: none; }
  .C main { padding-top: 20px; }
  .C .t { display: none; }
  .C .mob { display: block; list-style: none; border-top: 1px solid var(--text); }
  .C .mob li { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .C .mob .g { flex: 1; min-width: 0; }
  .C .mob .g b, .C .mob .g span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .C .mob .g span { font-size: 13px; color: var(--muted); }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search)
const V = (q.get('v') || 'a').toUpperCase(), P = q.get('p') || 'clienti', LOADING = q.get('s') === 'loading'
const I = {
  house:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  brief:'<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>',
  cal:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  set:'<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  at:'<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
  dots:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  menu:'<path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  minus:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  chev:'<path d="m9 18 6-6-6-6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
}
const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`
const ini = (s) => s.split(/\s+/).filter(w => /^[A-ZÀ-Ý]/.test(w)).slice(0,2).map(w => w[0]).join('')
const clients = [
  { n:'Cantina Monteverde — vini e ospitalità in collina', acc:0, st:'none', ppl:2, role:'Owner', prof:[] },
  { n:'Forno Luce', acc:2, st:'ok', ppl:3, role:'Owner', prof:[['IG','@fornoluce','ok'],['FB','Forno Luce','ok']] },
  { n:'Palestra Kinetic', acc:3, st:'ok', ppl:2, role:'Owner', prof:[['IG','@kinetic.gym','ok'],['FB','Kinetic','ok'],['IG','@kinetic.kids','ok']] },
  { n:'Pizzeria Da Gino', acc:1, st:'warn', ppl:1, role:'Owner', prof:[['IG','@dagino','warn']] },
  { n:'Studio Riva', acc:2, st:'ok', ppl:3, role:'Owner', prof:[['IG','@studioriva','ok'],['FB','Studio Riva','ok']] },
]
const people = [
  { n:'Matteo Greco', e:'matteo@trendy.it', r:'Owner', w:'Tutti i clienti', s:'Attivo', last:'oggi, 20:12' },
  { n:'Giulia Ferri', e:'giulia@trendy.it', r:'Admin', w:'Tutti i clienti', s:'Attivo', last:'ieri' },
  { n:'Carla Collaboratrice', e:'carla.collaboratrice@studio-esterno.it', r:'Membro', w:'Publisher di Forno Luce, Editor di Studio Riva', roles:[['Publisher','Forno Luce'],['Editor','Studio Riva']], s:'Attivo', last:'3 giorni fa' },
  { n:'Luca Bianchi', e:'luca@trendy.it', r:'Membro', w:'Viewer di Pizzeria Da Gino', roles:[['Viewer','Pizzeria Da Gino']], s:'Attivo', last:'mai' },
]
const invite = { e:'anna@esterni.it', r:'Editor di Palestra Kinetic', exp:'scade lunedì 16 novembre' }
const stTxt = { ok:'funziona', warn:'da ricollegare', none:'nessun account' }
const stIc = { ok:'ok', warn:'warn', none:'minus' }
const accLine = (c) => c.acc === 0 ? 'Nessun account social' : `${c.acc} account social`
const chip = (st, label) => `<span class="chip ${st}">${ic(stIc[st] || 'ok')}${label}</span>`

function bar(active) {
  const nav = ['Home','Clienti','Account social','Utenti','Calendario']
  return `<header class="bar"><img src="logo.svg" alt="Feedway"><span class="org">Trendy ${ic('down')}</span><nav>${nav.map(l => `<a class="${l===active?'on':''}">${l}</a>`).join('')}</nav><span class="k">${ic('search')}Cerca<kbd>Ctrl K</kbd></span><span class="av">MG</span></header>`
}
function side(active) {
  const logo = V === 'C' ? 'logo-bianco.svg' : 'logo.svg'
  const nav = [['house','Home'],['brief','Clienti'],['at','Account social'],['users','Utenti']]
  return `<aside class="side"><a class="logo"><img src="${logo}" alt="Feedway"></a>
  <div><div class="ctx"><span class="tile">T</span><b>Trendy</b></div><div class="ctx"><span class="av" style="background:transparent">${ic('brief')}</span>Tutti i clienti</div></div>
  <nav>${nav.map(([i,l]) => `<div class="row-nav ${l===active?'on':''}">${ic(i)}${l}</div>`).join('')}</nav>
  <div class="me"><span class="av">MG</span><span><b style="font-size:14px">Matteo Greco</b><small>Owner · Trendy</small></span></div></aside>`
}
function topBar() {
  return `<header class="top"><img src="logo.svg" alt="Feedway"><button class="ctxm">Tutti i clienti ${ic("down")}</button>${V==="C" ? "" : `<span class="av">MG</span>`}</header>`
}
function tabbar(active) {
  const a = (i,l) => `<a class="${l===active?'on':''}">${ic(i)}${l}</a>`
  if (V === 'A') return `<nav class="tabbar">${a('house','Home')}${a('brief','Clienti')}<a><span class="plus soon">${ic('plus')}</span>Presto</a>${a('cal','Calendario')}${a('set','Impostazioni')}</nav>`
  if (V === 'B') return `<nav class="tabbar">${a('sun','Oggi')}${a('cal','Calendario')}<a><span class="plus">${ic('plus')}</span><span style="position:absolute;left:-9999px">Nuovo post</span></a>${a('brief','Clienti')}${a('menu','Menu')}</nav>`
  return `<nav class="tabbar">${a('house','Home')}${a('cal','Calendario')}<a><span class="plus">${ic('plus')}</span>Nuovo post</a>${a('brief','Clienti')}<a><span class="av" style="width:24px;height:24px;font-size:10px">MG</span>Tu</a></nav>`
}
function head(title, sub, cta, icon) {
  return `<div class="head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><button class="btn pri">${ic(icon)}<span class="l">${cta}</span></button></div>`
}

// ---------- Clienti
function clientiA() {
  if (LOADING) return `<ul class="list">${[160,220,130,190].map(w => `<li><span class="sk" style="width:32px;height:32px;border-radius:50%"></span><span class="grow"><span class="sk" style="width:${w}px;max-width:100%;height:14px;margin-bottom:8px"></span><span class="sk" style="width:110px;height:12px"></span></span><span class="sk" style="width:44px;height:36px"></span><span class="sk" style="width:24px;height:24px"></span></li>`).join('')}</ul>`
  return `<ul class="list">${clients.map(c => `<li><span class="av">${ini(c.n)}</span><span class="grow"><div class="name">${c.n}</div><div class="sub">${c.acc ? c.acc + ' account' : 'Nessun account'} · ${c.st==='warn'?'<span style="color:var(--warn);font-weight:600">da ricollegare</span>':c.st==='ok'?'funziona':'da collegare'}<span class="lbl"> · ${c.ppl} ${c.ppl===1?'persona':'persone'}</span></div></span><button class="btn out">${ic('at')}<span class="lbl">Account social</span></button><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li>`).join('')}</ul>
  <details><summary>${ic('chev')} Archiviati (1)</summary></details>`
}
function clientiB() {
  const tools = `<div class="tools"><div class="seg"><button class="on">Attivi<b>5</b></button><button>Archiviati<b>1</b></button></div><div class="search">${ic('search')}Cerca un cliente</div></div>`
  if (LOADING) return tools + `<div class="card"><table class="desk"><thead><tr><th>Cliente</th><th>Account social</th><th>Persone</th><th>Il tuo ruolo</th><th></th></tr></thead><tbody>${[180,120,150,110].map(w => `<tr><td><span class="cl"><span class="sk" style="width:28px;height:28px;border-radius:7px"></span><span class="sk" style="width:${w}px;height:14px"></span></span></td><td><span class="sk" style="width:120px;height:20px;border-radius:99px"></span></td><td><span class="sk" style="width:20px;height:14px"></span></td><td><span class="sk" style="width:60px;height:14px"></span></td><td></td></tr>`).join('')}</tbody></table><ul class="mob">${[180,120,150,110].map(w => `<li><span class="sk" style="width:28px;height:28px;border-radius:7px"></span><span class="g"><span class="sk" style="width:${w}px;height:14px;margin-bottom:8px"></span><span class="sk" style="width:140px;height:12px"></span></span></li>`).join('')}</ul></div>`
  return tools + `<div class="card"><table class="desk"><thead><tr><th>Cliente</th><th>Account social</th><th>Persone</th><th>Il tuo ruolo</th><th></th></tr></thead><tbody>${clients.map(c => `<tr><td><span class="cl"><span class="sq">${ini(c.n)}</span>${c.n}</span></td><td><span style="display:inline-flex;align-items:center;gap:8px">${c.acc ? `<span class="num" style="width:1ch">${c.acc}</span>` : '<span style="width:1ch"></span>'}${chip(c.st, stTxt[c.st])}</span></td><td class="num">${c.ppl}</td><td>${c.role}</td><td class="act"><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></td></tr>`).join('')}</tbody></table>
  <ul class="mob">${clients.map(c => `<li><span class="sq">${ini(c.n)}</span><span class="g"><b>${c.n}</b><span>${c.acc ? c.acc + ' account · ' : ''}${c.ppl} ${c.ppl===1?'persona':'persone'}</span></span>${c.st==='ok' ? '' : chip(c.st, c.st==='warn'?'ricollega':'nessuno')}<button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li>`).join('')}</ul></div>
  <p class="note">Un clic sulla riga apre il cliente. Rinomina, Persone e Archivia sono nel menu «⋯».</p>`
}
function clientiC() {
  const handles = (c) => c.prof.length ? c.prof.map(p => p[1]).join(' · ') : 'Nessun profilo collegato'
  const st = (c) => `<span class="st ${c.st}"><i></i>${c.st==='ok'?'Funziona':c.st==='warn'?'Da ricollegare':'Nessun account'}</span>`
  if (LOADING) return `<table class="t"><thead><tr><th>Cliente</th><th>Profili</th><th>Meta</th><th class="r">Persone</th><th></th></tr></thead><tbody>${[200,140,170,120].map(w => `<tr><td><span class="sk" style="width:${w}px;height:14px"></span></td><td><span class="sk" style="width:160px;height:12px"></span></td><td><span class="sk" style="width:80px;height:12px"></span></td><td class="r"><span class="sk" style="width:16px;height:12px;margin-left:auto"></span></td><td></td></tr>`).join('')}</tbody></table><ul class="mob">${[200,140,170,120].map(w => `<li><span class="g"><span class="sk" style="width:${w}px;height:14px;margin-bottom:8px"></span><span class="sk" style="width:150px;height:12px"></span></span></li>`).join('')}</ul>`
  return `<p class="sum">5 clienti. <a>Pizzeria Da Gino</a> ha un account da ricollegare.</p>
  <table class="t"><thead><tr><th>Cliente</th><th>Profili</th><th>Meta</th><th class="r">Persone</th><th></th></tr></thead><tbody>${clients.map(c => `<tr><td class="nm">${c.n}</td><td class="h">${handles(c)}</td><td>${st(c)}</td><td class="r num">${c.ppl}</td><td class="act"><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></td></tr>`).join('')}</tbody></table>
  <ul class="mob">${clients.map(c => `<li><span class="g"><b>${c.n}</b><span>${c.st==='warn' ? '<span class="st warn" style="display:inline-flex"><i></i>Da ricollegare</span>' : handles(c)}</span></span><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li>`).join('')}</ul>
  <p class="note">Archiviati: 1. Il nome apre il cliente; «⋯» ha Account social, Persone, Rinomina, Archivia. Ctrl K cerca ovunque.</p>`
}
// ---------- Utenti
function utentiA() {
  return `<ul class="list">${people.map(p => `<li><span class="av">${ini(p.n)}</span><span class="grow"><div class="name">${p.n}</div><div class="sub">${p.r} · ${p.r==='Membro' ? p.w : p.e}</div></span><span class="chip ok">${ic('ok')}Attivo</span><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li>`).join('')}</ul>
  <div class="sec"><h2>Inviti in attesa (1)</h2><ul class="list"><li><span class="av">${ic('mail')}</span><span class="grow"><div class="name">${invite.e}</div><div class="sub">${invite.r} · ${invite.exp}</div></span><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li></ul></div>`
}
function utentiB() {
  const tools = `<div class="tools"><div class="seg"><button class="on">Persone<b>4</b></button><button>Inviti<b>1</b></button><button>Ruoli</button></div></div>`
  return tools + `<div class="card"><table class="desk"><thead><tr><th>Persona</th><th>In agenzia</th><th>Ruoli per cliente</th><th>Stato</th><th>Ultimo accesso</th><th></th></tr></thead><tbody>${people.map(p => `<tr><td><span class="cl"><span class="av" style="width:28px;height:28px;font-size:11px">${ini(p.n)}</span>${p.n}</span></td><td>${p.r}</td><td>${p.w}</td><td>${chip('ok','Attivo')}</td><td>${p.last}</td><td class="act"><button class="btn ghost">${ic('dots')}</button></td></tr>`).join('')}</tbody></table>
  <ul class="mob">${people.map(p => `<li><span class="av">${ini(p.n)}</span><span class="g"><b>${p.n}</b><span>${p.r} · ${p.w}</span></span><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li>`).join('')}</ul></div>`
}
function utentiC() {
  return `<table class="t"><thead><tr><th>Persona</th><th>Email</th><th>In agenzia</th><th>Clienti</th><th class="r">Ultimo accesso</th><th></th></tr></thead><tbody>${people.map(p => `<tr><td class="nm">${p.n}</td><td class="h">${p.e}</td><td>${p.r}</td><td class="h">${p.w}</td><td class="r">${p.last}</td><td class="act"><button class="btn ghost">${ic('dots')}</button></td></tr>`).join('')}<tr><td class="nm" style="font-weight:400;color:var(--muted)">Invito in attesa</td><td>${invite.e}</td><td>Membro</td><td class="h">${invite.r}</td><td class="r muted">${invite.exp}</td><td class="act"><button class="btn ghost">${ic('dots')}</button></td></tr></tbody></table>
  <ul class="mob">${people.map(p => `<li><span class="g"><b>${p.n}</b><span>${p.r} · ${p.w}</span></span><button class="btn ghost" aria-label="Altre azioni">${ic('dots')}</button></li>`).join('')}<li><span class="g"><b style="font-weight:400">${invite.e}</b><span>Invito · ${invite.exp}</span></span><button class="btn ghost">${ic('dots')}</button></li></ul>`
}

const pages = {
  clienti: { t:'Clienti', nav:'Clienti', sub: V==='B' ? '5 clienti · 1 account da ricollegare' : V==='C' ? '' : 'I clienti che l\'agenzia segue, con i loro account social e chi ci lavora.', cta:'Nuovo cliente', icon:'plus', body: { A: clientiA, B: clientiB, C: clientiC } },
  utenti: { t:'Utenti', nav:'Utenti', sub:'4 persone, 1 invito in attesa', cta:'Invita', icon:'users', body: { A: utentiA, B: utentiB, C: utentiC } },
}
const pg = pages[P]
document.body.className = V
document.getElementById('root').innerHTML = `<div class="app">${V==='C' ? bar(pg.nav) : side(pg.nav)}${topBar()}<main><div class="wrap">${head(pg.t, pg.sub, pg.cta, pg.icon)}${pg.body[V]()}</div></main>${tabbar(P==='clienti'?'Clienti':'')}</div>`
</script>
</body>
</html>
